<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hundespiel" />
    <meta name="theme-color" content="#6fc45a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Hundespiel Prototyp</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #6fc45a; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; }
      #game { position: absolute; inset: 0; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; text-align: center; padding: 24px;
        background: #2b6cb0; color: #fff; font: 600 20px Arial, Helvetica, sans-serif; }
      @media (orientation: portrait) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Bitte das Handy quer halten</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
