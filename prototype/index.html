<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hundespiel" />
    <meta name="theme-color" content="#6fc45a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>Hundespiel Prototyp</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #6fc45a; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; }
      #game { position: absolute; inset: 0; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; text-align: center; padding: 24px;
        background: #2b6cb0; color: #fff; font: 600 20px Arial, Helvetica, sans-serif; }
      @media (orientation: portrait) { #rotate { display: flex; } }
      #ui { display: none; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center; background: #6fc45a;
        font-family: Arial, Helvetica, sans-serif; touch-action: manipulation; overflow: auto; }
      #ui .card { background: #fff; border-radius: 16px; padding: 20px 24px; width: min(360px, 86vw); display: flex; flex-direction: column; gap: 10px;
        box-shadow: 0 6px 24px rgba(0,0,0,.25); text-align: center; color: #2b2b2b; -webkit-user-select: auto; user-select: auto; }
      #ui h1 { margin: 0 0 4px; font-size: 22px; }
      #ui input { font-size: 16px; padding: 10px 12px; border: 2px solid #cbd5e0; border-radius: 10px; }
      #ui button { font-size: 16px; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 10px; background: #2b6cb0; color: #fff; }
      #ui button.alt { background: #4a9b3a; }
      #ui button:disabled { opacity: .6; }
      #ui .row { display: flex; gap: 8px; } #ui .row button { flex: 1; }
      #ui .msg { margin: 0; min-height: 18px; color: #c53030; font-size: 14px; }
      #ui.bar { background: transparent; align-items: flex-end; padding-bottom: 10px; pointer-events: none; }
      #ui.bar .card { pointer-events: auto; width: min(560px, 92vw); padding: 10px 16px; gap: 6px; } #ui.bar .msg { min-height: 0; }
      #ui .card .row input { flex: 2; min-width: 0; }
      #ui .pick-title { font-weight: 600; font-size: 15px; }
      #hud { display: none; position: fixed; inset: 0; z-index: 4; pointer-events: none; font-family: Arial, Helvetica, sans-serif; touch-action: manipulation; }
      #hud #gear, #hud #map { pointer-events: auto; position: absolute; left: calc(8px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 22px;
        border: 0; background: rgba(255,255,255,.9); font-size: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
      #hud #map { left: calc(60px + env(safe-area-inset-left)); }
      #hud #stats { position: absolute; right: calc(8px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top)); display: flex; gap: 6px; font-size: 13px; font-weight: 700; color: #2b2b2b; }
      #hud #stats span { background: rgba(255,255,255,.9); border-radius: 14px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
      #hud #stats .coin { display: inline-block; width: 11px; height: 11px; border-radius: 6px; background: #f0b429; margin-right: 5px; vertical-align: -1px; }
      #hud #toast { position: absolute; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%); max-width: 70vw; background: rgba(0,0,0,.6); color: #fff;
        border-radius: 16px; padding: 7px 14px; font-size: 14px; opacity: 0; transition: opacity .3s; text-align: center; }
      #ui.title { background: linear-gradient(#6ec6ff, #6fc45a 70%); } #ui.title h1 { font-size: 32px; text-align: center; } #ui .sub { text-align: center; color: #4a5568; margin: 0; font-size: 14px; }
      #settings { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; overflow: auto; }
      #settings .card { background: #fff; border-radius: 16px; padding: 16px 20px; width: min(380px, 88vw); max-height: 92vh; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
      #settings h1 { margin: 0; font-size: 20px; } #settings .sub { font-weight: 700; font-size: 13px; margin-top: 4px; }
      #settings .verlauf { font-size: 13px; display: flex; flex-direction: column; gap: 2px; max-height: 110px; overflow: auto; }
      #settings .card > * { flex-shrink: 0; }
      #settings .row { display: grid; grid-template-columns: 110px 1fr 74px; gap: 8px; align-items: center; font-size: 13px; }
      #settings .bar { height: 8px; background: #e3e8ee; border-radius: 4px; overflow: hidden; } #settings .bar > i { display: block; height: 100%; background: #4a9b3a; }
      #settings .shop { max-height: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } #settings .shop > div { grid-column: 1 / -1; } #settings .shop button { font-size: 13px; padding: 7px 6px; } #settings .shop button:disabled { opacity: .45; }
      #settings button { font-size: 16px; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 10px; background: #2b6cb0; color: #fff; }
      #settings button.alt { background: #4a9b3a; } #settings button.danger { background: #c53030; } #settings button.tab { background: #cbd5e0; color: #2b2b2b; }
      #ui .code { font: 700 36px monospace; letter-spacing: 6px; background: #edf2f7; border-radius: 10px; padding: 8px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="rotate">Bitte das Handy quer halten</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
