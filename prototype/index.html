<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hundespiel" />
    <meta name="theme-color" content="#6fc45a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>Hundespiel Prototyp</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #6fc45a; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; }
      #game { position: absolute; inset: 0; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center; text-align: center; padding: 24px;
        background: #2b6cb0; color: #fff; font: 600 20px Arial, Helvetica, sans-serif; }
      @media (orientation: portrait) { #rotate { display: flex; } }
      #ui { display: none; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center; background: #6fc45a;
        font-family: Arial, Helvetica, sans-serif; touch-action: manipulation; overflow: auto; }
      #ui .card { background: #fff; border-radius: 16px; padding: 20px 24px; width: min(360px, 86vw); display: flex; flex-direction: column; gap: 10px;
        box-shadow: 0 6px 24px rgba(0,0,0,.25); text-align: center; color: #2b2b2b; -webkit-user-select: auto; user-select: auto; }
      #ui h1 { margin: 0 0 4px; font-size: 22px; }
      #ui input { font-size: 16px; padding: 10px 12px; border: 2px solid #cbd5e0; border-radius: 10px; }
      #ui button { font-size: 16px; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 10px; background: #2b6cb0; color: #fff; }
      #ui button.alt { background: #4a9b3a; }
      #ui button:disabled { opacity: .6; }
      #ui .row { display: flex; gap: 8px; } #ui .row button { flex: 1; }
      #ui .msg { margin: 0; min-height: 18px; color: #c53030; font-size: 14px; }
      #ui.bar { background: transparent; align-items: flex-end; padding-bottom: 10px; pointer-events: none; }
      #ui.bar .card { pointer-events: auto; width: min(560px, 92vw); padding: 10px 16px; gap: 6px; } #ui.bar .msg { min-height: 0; }
      #ui .card .row input { flex: 2; min-width: 0; }
      #ui .pick-title { font-weight: 600; font-size: 15px; }
      #hud { display: none; position: fixed; inset: 0; z-index: 4; pointer-events: none; font-family: Arial, Helvetica, sans-serif; color: #2b2b2b; touch-action: manipulation; }
      #hud .hud-panel { pointer-events: auto; position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.93);
        border-radius: 12px; padding: 6px 10px; display: flex; flex-direction: row; align-items: center; gap: 12px; box-shadow: 0 3px 12px rgba(0,0,0,.25); font-size: 13px; }
      #hud .hud-panel .bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
      #hud .hud-panel .mood { min-width: 64px; }
      #hud .hud-msg { position: absolute; left: 10px; bottom: 100%; margin-bottom: 4px !important; }
      #hud .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
      #hud button { font-size: 13px; font-weight: 600; border: 0; border-radius: 8px; padding: 7px 8px; background: #2b6cb0; color: #fff; }
      #hud button.alt { background: #4a9b3a; } #hud button:disabled { opacity: .5; }
      #hud button.tab { background: #cbd5e0; color: #2b2b2b; } #hud button.tab.on { background: #2b6cb0; color: #fff; }
      #hud .row { display: flex; gap: 6px; } #hud .row button { flex: 1; }
      #hud .mood { font-weight: 700; text-align: center; }
      #hud .bar-row { display: flex; align-items: center; gap: 6px; } #hud .bar-row span { width: 50px; }
      #hud .track { flex: 1; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; } #hud .fill { height: 100%; }
      #hud .hud-msg { margin: 0; color: #c53030; font-size: 12px; background: rgba(255,255,255,.93); border-radius: 8px; padding: 3px 8px; } #hud .hud-msg:empty { display: none; }
      #hud .hud-log { position: absolute; right: 8px; top: calc(8px + env(safe-area-inset-top)); max-width: min(300px, 46vw); font-size: 12px; text-align: right; color: #fff;
        background: rgba(0,0,0,.45); border-radius: 10px; padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; }
      #hud .hud-log:empty { display: none; } #hud .hud-log > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #ui .code { font: 700 36px monospace; letter-spacing: 6px; background: #edf2f7; border-radius: 10px; padding: 8px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="rotate">Bitte das Handy quer halten</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
